<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lost Temple</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.mini{display:grid;grid-template-columns:18px repeat(8,1fr);gap:3px;align-items:center}
.mini .lab{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.mini button{min-height:0;height:36px;padding:0;border-radius:7px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:700}
.mini button.ok{border-color:var(--accent);border-width:2.5px}
.mini button.blk{background:#06071a;border-color:#06071a}
.mini button.crk{border:2.5px dashed var(--alert);color:var(--alert)}
.mini button.door{background:var(--line);color:var(--ink)}
.mini button.me{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mini button.oth{background:var(--muted);color:var(--paper);border-color:var(--muted)}
.mini button.shd{background:var(--alert);color:#fff;border-color:var(--alert)}
.hearts{font-size:22px;letter-spacing:3px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.now{position:sticky;top:0;z-index:5;border-radius:16px;padding:12px 14px;background:var(--pc);color:var(--pi);display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.now .av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--pi);color:var(--pc);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px}
.now .nm{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;overflow-wrap:anywhere}
.now .sub{font-size:14px;font-weight:700;opacity:.85}
.steps{display:flex;gap:6px;margin:2px 0 4px}
.steps span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:7px 4px;border-radius:9px;border:1.5px solid var(--line);color:var(--muted)}
.steps span.cur{background:var(--pc);color:var(--pi);border-color:var(--pc)}
.steps span.done{opacity:.55;text-decoration:line-through}
.warn{color:var(--alert);font-weight:700}
.p0{--pc:#ffd23f;--pi:#1b1f4b} .p1{--pc:#ff5a4e;--pi:#fff}
.mini button.me{background:var(--pc);color:var(--pi);border-color:var(--pc)}
#res .card{border-top:8px solid var(--pc)}
#res .nextname{font-family:var(--display);font-weight:800;font-size:34px;margin:0;color:var(--pc)}
</style>
</head>
<body class="g-temple">
<main class="wrap">
  <div class="top"><a href="index.html">‹ Games</a><button class="ghost small" data-mute style="width:auto">Sound: on</button></div>
  <h1>The Lost Temple</h1>

  <section class="view on" id="v-setup">
    <div class="card">
      <label for="map">Which map are you playing?</label>
      <select id="map"></select>
      <p class="muted small">The map number is printed at the top of the page in your book.</p>
      <label for="n1">Explorer 1</label><input type="text" id="n1" maxlength="14" placeholder="First name">
      <label for="n2">Explorer 2 (leave empty to play alone)</label><input type="text" id="n2" maxlength="14" placeholder="First name"><p class="muted small">Two explorers? Each one draws on their own copy of the same map number.</p>
          </div>
    <button id="start">Enter the temple</button>
    <button class="ghost small" id="how">How to play</button>
  </section>

  <section class="view" id="v-play">
    <p class="turn" id="turn"></p>
    <div class="card alertbox" id="newsbox"><p class="eyebrow">In the temple</p><div id="news" class="list"></div></div>
    <div class="now" id="now"><div class="av" id="now-av"></div><div><div class="nm" id="who"></div><div class="sub" id="now-sub"></div></div></div>
    <div class="card" id="playcard">
      <div class="steps" id="steps"></div>
      <div class="dice" id="dice"></div>
      <p id="hint"></p>
      <p class="warn" id="warn" hidden></p>
      <div class="row" id="nudge" hidden></div>
      <div class="mini" id="mini"></div>
      <div class="legend"><span>■ collapsed</span><span>▢ dashed: cracking</span><span>S: the Shadow</span></div>
      <div class="row"><button class="ghost small" id="trap">I crossed a trap: lose a heart</button><button class="ghost small" id="stuck">I can't move</button></div>
    </div>
    <div class="card" id="statbox"></div>
    <button class="ghost small" id="new">New game</button>
  </section>

  <div class="overlay" id="res"><div class="card">
    <p class="eyebrow" id="res-eye"></p><h2 id="res-title"></h2><div id="res-body" class="list"></div>
    <p class="muted small" id="res-lead"></p><p class="nextname" id="res-next"></p>
    <button id="res-btn"></button></div></div>

  <section class="view" id="v-end">
    <p class="turn">The adventure is over.</p>
    <div class="card" id="endbox"></div>
    <button id="cardbtn">Make the winner's card</button>
    <button class="ghost small" id="again">Play another map</button>
  </section>
</main>
<script src="maps.js"></script>
<script src="shared.js"></script>
<script>
(function(){
"use strict";
var $=GN.$, COLS='ABCDEFGH', DOOR='D10', S;
function xy(k){return [COLS.indexOf(k[0]),parseInt(k.slice(1),10)-1]}
function key(x,y){return COLS[x]+(y+1)}
function nb(k){var p=xy(k),o=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var x=p[0]+d[0],y=p[1]+d[1];if(x>=0&&x<8&&y>=0&&y<10)o.push(key(x,y))});return o}
function dist(a,b){a=xy(a);b=xy(b);return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])}
function show(v){['setup','play','end'].forEach(function(x){$('#v-'+x).classList.toggle('on',x===v)});window.scrollTo(0,0)}

/* setup */
var sel=$('#map');for(var i=1;i<=30;i++){if(window.TEMPLE_MAPS[i])sel.insertAdjacentHTML('beforeend','<option value="'+i+'">Map '+i+'</option>')}
var m=(location.search.match(/[?&]m=(\d+)/)||location.hash.match(/map(\d+)/)||[])[1];if(m&&window.TEMPLE_MAPS[m])sel.value=m;
var HOW=["You explore a crumbling temple <b>with a pencil, on the map in your book</b>. The phone rolls the dice and runs everything that hides or moves.",
 "Each turn you get two dice. <b>Pick one to move</b> exactly that many squares. The other is your <b>Strength</b> if you stop on a guardian.",
 "Draw your path in the book, then <b>tap the square where you stop</b> here. The phone tells you what happens there.",
 "Squares marked <b>?</b> hide a surprise. From turn 4, <b>the Shadow</b> hunts you. Be back at the DOOR before turn 10 ends!"];
$('#how').onclick=function(){GN.howto('The Lost Temple',HOW)};
$('#start').onclick=function(){GN.beep('tap');GN.wake();start()};

function start(){
  var id=sel.value, map=window.TEMPLE_MAPS[id], names=[$('#n1').value.trim()||'Explorer 1'];if($('#n2').value.trim())names.push($('#n2').value.trim());
  var myst=Object.keys(map.cells).filter(function(k){return map.cells[k]==='q'}), kinds=GN.sample(['treasure','treasure','treasure','trap','trap','potion','empty','empty'],8), mk={};
  myst.forEach(function(k,i){mk[k]=kinds[i]||'empty'});
  S={id:id,myst:mk,turn:0,blocked:{},crack:null,shadow:null,lair:null,
     players:names.map(function(n){return {name:n,cells:JSON.parse(JSON.stringify(map.cells)),pos:DOOR,hearts:3,out:false,dead:false,left:false,done:false}}),cur:0,dice:[],moveDie:null,log:[]};
  show('play');nextTurn()}

function active(){return S.players.filter(function(p){return !p.out&&!p.dead})}
function nextTurn(){
  if(S.turn>=10||!active().length){return finish()}
  S.turn++;var news=[];
  if(S.crack){S.blocked[S.crack]=1;S.players.forEach(function(q){delete q.cells[S.crack]});news.push('<b>'+S.crack+' has collapsed.</b> '+(S.players.length>1?'Everyone blacks it out on their own map.':'Black it out on your map.')+' Whatever was there is lost.');GN.beep('rumble');S.crack=null}
  if(S.turn===4){var corners=['A1','H1','A10','H10'].filter(function(k){return !S.blocked[k]});
    corners.sort(function(a,b){return minDist(b)-minDist(a)});S.lair=corners[0]||'A1';S.shadow=S.lair;news.push('<b>The Shadow wakes up on '+S.shadow+'.</b> It moves 2 squares toward you after every turn. If it catches you, you lose a heart.');GN.beep('alarm')}
  if(S.turn===6){news.push('<b>The temple is shaking.</b> Start thinking about your way back to the DOOR.');GN.beep('rumble')}
  if(S.turn===9){news.push('<b>Two turns left.</b> Anyone still inside after turn 10 keeps only their coins.')}
  if(S.turn<10){var free=[];for(var x=0;x<8;x++)for(var y=0;y<10;y++){var k=key(x,y);if(k!==DOOR&&!S.blocked[k]&&!S.players.some(function(p){return p.pos===k&&!p.out}))free.push(k)}
    S.crack=GN.pick(free);news.push('<b>'+S.crack+' is cracking.</b> It will collapse next turn. You may walk across it, but you cannot stop there.')}
  S.roll=[GN.d6(),GN.d6()];S.dice=S.roll.slice();S.fresh=true;S.nudged=false;S.cur=-1;S.news=news;S.players.forEach(function(p){p.done=false});
  advance()}
function minDist(k){var d=99;active().forEach(function(p){d=Math.min(d,dist(k,p.pos))});return d}
function advance(){
  do{S.cur++}while(S.cur<S.players.length&&(S.players[S.cur].out||S.players[S.cur].dead));
  if(S.cur>=S.players.length){return endOfTurn()}
  S.dice=S.roll.slice();S.nudged=false;S.moveDie=null;draw()}

/* legal end squares for a move of exactly n steps (stopping early is allowed only on the DOOR) */
function ends(p,n){var res={},start=p.pos;
  (function go(k,left,seen){
    if(left===0){res[k]=1;return}
    nb(k).forEach(function(q){if(S.blocked[q]||seen[q])return;
      var g=p.cells[q]&&p.cells[q][0]==='g';
      if(q===DOOR){res[q]=1}
      if(g&&left>1)return;
      var s2=Object.assign({},seen);s2[q]=1;go(q,left-1,s2)})
  })(start,n,(function(){var o={};o[start]=1;return o})());
  delete res[start];if(S.crack)delete res[S.crack];return res}
function canMove(p){return Object.keys(ends(p,S.dice[0])).length||Object.keys(ends(p,S.dice[1])).length}

function draw(){
  var p=S.players[S.cur];
  $('#turn').textContent='Turn '+S.turn+' of 10';
  $('#news').innerHTML=(S.news||[]).map(function(t){return '<p>'+t+'</p>'}).join('')||'<p class="muted">All quiet. For now.</p>';
  var pi=S.cur,duel=S.players.length>1;$('#v-play').className='view on p'+pi;
  $('#who').textContent=p.name;$('#now-av').textContent=p.name[0].toUpperCase();
  $('#now-sub').textContent=(duel?'Your move. Only '+p.name+' taps now.':'Your move.')+' '+'\u2665'.repeat(p.hearts);
  var st=S.moveDie===null?0:1;
  $('#steps').innerHTML=['1 · Tap a die','2 · Draw your path','3 · Tap your square'].map(function(x,i){return '<span class="'+(i<st?'done':(i===st||(st===1&&i===2))?'cur':'')+'">'+x+'</span>'}).join('');
  $('#warn').hidden=!S.warn;$('#warn').textContent=S.warn||'';S.warn=null;
  $('#dice').innerHTML=S.dice.map(function(v,i){return GN.dieHTML(v,'button',S.moveDie===i?'pick':'','data-d="'+i+'"')}).join('');
  if(S.fresh){S.fresh=false;GN.roll($('#dice'))}
  var dbl=S.roll[0]===S.roll[1]&&!S.nudged;
  $('#nudge').hidden=!dbl;
  $('#nudge').innerHTML=dbl?'<button class="ghost small" data-n="1">Doubles! Add 1 to one die</button><button class="ghost small" data-n="-1">Doubles! Take 1 off one die</button>':'';
  var E=S.moveDie===null?{}:ends(p,S.dice[S.moveDie]);
  $('#hint').innerHTML=S.moveDie===null?'<b>'+GN.esc(p.name)+'</b>, tap the die you move with. The other one is your Strength.':
    (Object.keys(E).length?'Draw your path of <b>'+S.dice[S.moveDie]+'</b> on '+(S.players.length>1?'<b>your own map</b>':'your map')+', then tap the square where you stop. Strength: <b>'+S.dice[1-S.moveDie]+'</b>. <span class="muted">The phone trusts your pencil: it does not check the path you drew.</span>':'No square can be reached with this die. Try the other one.');
  var h='<span></span>';for(var x=0;x<8;x++)h+='<span class="lab">'+COLS[x]+'</span>';
  for(var y=0;y<10;y++){h+='<span class="lab">'+(y+1)+'</span>';for(x=0;x<8;x++){var k=key(x,y),c='',t='';
    if(S.blocked[k]){c='blk'}else if(k===p.pos){c='me';t=p.name[0].toUpperCase()}
    else if(S.shadow===k){c='shd';t='S'}
    else if(S.players.some(function(o){return o!==p&&o.pos===k&&!o.out&&!o.dead})){c='oth';t=S.players.filter(function(o){return o!==p&&o.pos===k})[0].name[0].toUpperCase()}
    else if(k===S.crack){c='crk';t='!'}else if(k===DOOR){c='door';t='D'}
    if(E[k])c+=' ok';
    h+='<button class="'+c+'" data-k="'+k+'" aria-label="'+k+'">'+t+'</button>'}}
  $('#mini').innerHTML=h;
  $('#statbox').innerHTML='<p class="eyebrow">Explorers</p>'+S.players.map(function(q){
    return '<p><b>'+GN.esc(q.name)+'</b> · <span class="hearts">'+'♥'.repeat(q.hearts)+'♡'.repeat(3-q.hearts)+'</span> · '+(q.dead?'<span class="pill bad">out of hearts</span>':q.out?'<span class="pill good">outside, safe</span>':'on '+q.pos)+'</p>'}).join('')+
    '<p class="muted small">Coins, guardians and relics are counted in the book.</p>'}
function result(p,msg,kind){
  var i=S.players.indexOf(p),nx=null;for(var j=i+1;j<S.players.length;j++){var q=S.players[j];if(!q.out&&!q.dead){nx=q;break}}
  var R=$('#res');R.className='overlay on p'+i;
  $('#res-eye').textContent='Turn '+S.turn+' of 10 · '+p.name;$('#res-title').textContent=p.name+"'s move is done";
  $('#res-body').innerHTML=msg.map(function(t){return '<p>'+t+'</p>'}).join('');
  var last=S.turn>=10||!S.players.some(function(q,j){return !q.out&&!q.dead});
  if(nx){$('#res-lead').textContent='Now pass the phone to';$('#res-next').textContent=nx.name;$('#res-next').style.color=j===1?'#ff5a4e':'#ffd23f';$('#res-btn').textContent='I am '+nx.name}
  else{$('#res-lead').textContent=last?'':(S.players.length>1?'Everyone has played turn '+S.turn+'.':'');$('#res-next').textContent='';$('#res-btn').textContent=last?'See the end of the adventure':'Start turn '+(S.turn+1)}
  $('#res-btn').onclick=function(){GN.beep('tap');R.className='overlay';advance()};window.scrollTo(0,0)}
function firstActive(){for(var i=0;i<S.players.length;i++)if(!S.players[i].out&&!S.players[i].dead)return i;return -1}
function say(t,kind){S.news=[t];GN.beep(kind||'tap')}
function hurt(p){p.hearts=Math.max(0,p.hearts-1);if(p.hearts===0){p.dead=true}}

$('#dice').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.moveDie=+b.dataset.d;GN.beep('tap');draw()});
$('#nudge').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=+b.dataset.n;
  var v=S.dice[0]+d;if(v<1||v>6){return}S.dice[0]=v;S.nudged=true;S.moveDie=null;GN.beep('tap');draw()});
$('#trap').addEventListener('click',function(){var p=S.players[S.cur];hurt(p);GN.beep('bad');
  if(p.dead){return result(p,['<b>'+GN.esc(p.name)+' has no hearts left.</b> The adventure ends here: score 0.'])}
  S.warn='Ouch. One heart less for '+p.name+'. Cross out the trap in the book.';draw()});
$('#stuck').addEventListener('click',function(){var p=S.players[S.cur];
  if(canMove(p)){S.warn='You can still move: try the other die, or look for another path.';GN.beep('bad');return draw()}
  result(p,[GN.esc(p.name)+' is stuck this turn and stays on '+p.pos+'.'])});
$('#mini').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||S.moveDie===null)return;
  var p=S.players[S.cur],k=b.dataset.k,E=ends(p,S.dice[S.moveDie]);
  if(!E[k]){S.warn=k===S.crack?'That square is cracking: you cannot stop there.':'You cannot stop on '+k+' with a move of '+S.dice[S.moveDie]+'. Check your path.';GN.beep('bad');return draw()}
  arrive(p,k,S.dice[1-S.moveDie])});

function arrive(p,k,str){
  p.pos=k;p.left=true;var c=p.cells[k],msg=[];
  if(k===DOOR){p.out=true;msg.push('<b>'+GN.esc(p.name)+' is out of the temple, safe and sound!</b> Count everything on your map.');GN.beep('good')}
  else if(c&&c[0]==='g'){var lv=+c[1];
    if(str>=lv){delete p.cells[k];msg.push('<b>Guardian beaten!</b> Strength '+str+' against level '+lv+'. Cross it out and score <b>'+lv+' points</b>.');GN.beep('good')}
    else{hurt(p);msg.push('<b>The guardian wins.</b> Strength '+str+' against level '+lv+'. Lose a heart. To try again, step off and come back.');GN.beep('bad')}}
  else if(c==='q'){var kind=S.myst[k];delete p.cells[k];
    if(kind==='treasure'){msg.push('<b>The ? hides a treasure chest!</b> Write +3 in that square.');GN.beep('good')}
    else if(kind==='trap'){hurt(p);msg.push('<b>The ? hides a trap.</b> Lose a heart.');GN.beep('bad')}
    else if(kind==='potion'){if(p.hearts<3){p.hearts++;msg.push('<b>The ? hides a healing potion.</b> Win back a heart.')}else msg.push('<b>The ? hides a healing potion</b>, but you already have all your hearts.');GN.beep('good')}
    else{msg.push('The ? hides... dust and cobwebs. Nothing here.');GN.beep('tap')}}
  else if(c==='t'){hurt(p);delete p.cells[k];msg.push('<b>A trap!</b> Lose a heart and cross it out.');GN.beep('bad')}
  else if(c==='r'){delete p.cells[k];msg.push('<b>A relic!</b> Circle it: 5 points if you make it out.');GN.beep('good')}
  else if(c==='c'){delete p.cells[k];msg.push('A coin. Circle it, along with every coin on your path.');GN.beep('tap')}
  else{msg.push(GN.esc(p.name)+' stops on '+k+'.');GN.beep('tap')}
  if(p.dead)msg.push('<b>'+GN.esc(p.name)+' has no hearts left.</b> The adventure ends here: score 0.');
  msg.push('Write the turn number ('+S.turn+') in square '+k+'.');
  p.done=true;result(p,msg)}

function endOfTurn(){
  var extra=[];
  if(S.shadow&&active().length){
    for(var s=0;s<2;s++){var t=active().sort(function(a,b){return dist(S.shadow,a.pos)-dist(S.shadow,b.pos)})[0];if(!t||S.shadow===t.pos)break;
      var best=nb(S.shadow).sort(function(a,b){return dist(a,t.pos)-dist(b,t.pos)})[0];S.shadow=best}
    active().forEach(function(p){if(p.pos===S.shadow&&p.pos!==DOOR){hurt(p);extra.push('<b>The Shadow catches '+GN.esc(p.name)+'!</b> Lose a heart. The Shadow slips back to its lair.');S.shadow=S.lair;GN.beep('bad');
      if(p.dead)extra.push('<b>'+GN.esc(p.name)+' has no hearts left.</b> Score 0.')}});
    if(!extra.length)extra.push('The Shadow creeps to '+S.shadow+'.')}
  var keep=extra;nextTurn();if($('#v-play').classList.contains('on')){S.news=keep.concat(S.news||[]);draw()}}

function finish(){
  var h='';S.players.forEach(function(p,i){var st=p.dead?'Out of hearts: <b>score 0</b>.':p.out?'Made it out. Count coins, guardians, relics, treasures (+3 each) and 2 points per heart left.':'Still inside: <b>coins only</b>.';
    h+='<div><label for="sc'+i+'">'+GN.esc(p.name)+'</label><p class="muted small">'+st+'</p><input type="number" id="sc'+i+'" min="0" inputmode="numeric" value="0"'+(p.dead?' disabled':'')+'></div>'});
  $('#endbox').innerHTML='<p class="eyebrow">Scores from the book</p>'+h;show('end');GN.beep('good')}
$('#cardbtn').onclick=function(){var rows=S.players.map(function(p,i){var v=parseInt($('#sc'+i).value,10);return {name:p.name,score:p.dead?0:(isNaN(v)?0:v)}});
  var top=Math.max.apply(null,rows.map(function(r){return r.score}));
  GN.card({game:'The Lost Temple · Map '+S.id,headline:top>=30?'Legend of the Temple':top>=20?'Seasoned Adventurer':top>=10?'Temple Explorer':'Brave Beginner',rows:rows,unit:'points'})};
$('#again').onclick=function(){show('setup')};
GN.confirmBtn($('#new'),'Tap again to erase this game',function(){show('setup')});
window.__temple=function(){return S};
})();
</script>
</body>
</html>
